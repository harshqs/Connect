#yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/import-project-yml-json-schema.json
#yamlPreprocessor=on

project:
  name: connect
  description: Real-time collaborative document editor
  corePackage: LIGHT
  tags:
    - hackathon

services:
  # PostgreSQL database — created first
  - hostname: db
    type: postgresql@16
    mode: NON_HA
    priority: 10

  # Express + WebSocket backend
  - hostname: api
    type: nodejs@22
    enableSubdomainAccess: true
    priority: 5
    buildFromGit: https://github.com/harshqs/Connect
    zeropsSetup: api

  # Next.js frontend
  - hostname: frontend
    type: nodejs@22
    enableSubdomainAccess: true
    priority: 1
    buildFromGit: https://github.com/harshqs/Connect
    zeropsSetup: frontend
