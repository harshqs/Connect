zerops:
  # ── Backend: Express REST API + Yjs WebSocket server ──────────────────────
  - setup: api
    build:
      base: nodejs@22
      buildCommands:
        - npm ci --include=dev
        - npx prisma generate
        - npx tsc --project tsconfig.server.json
      deployFiles:
        - dist-server/
        - prisma/
        - node_modules/
        - package.json
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        PORT: 3000
      start: node dist-server/server/index.js
      healthCheck:
        httpGet:
          port: 3000
          path: /health

  # ── Frontend: Next.js (standalone output) ─────────────────────────────────
  - setup: frontend
    build:
      base: nodejs@22
      buildCommands:
        - npm ci --include=dev
        - npx prisma generate
        - npm run build
      deployFiles:
        - .next/standalone/
        - .next/static/  => .next/standalone/.next/static/
        - public/        => .next/standalone/public/
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        PORT: 3000
        NODE_ENV: production
        HOSTNAME: 0.0.0.0
      start: node .next/standalone/server.js
      healthCheck:
        httpGet:
          port: 3000
          path: /
